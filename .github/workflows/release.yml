# Release: pushing a SemVer tag (vX.Y.Z or vX.Y.Z-rc.N) builds, tests and
# publishes a GitHub Release. See AGENTS.md -> "Releases" for the process.
#
# Guards:
#   - the tag must point at a commit on main
#   - the tag must equal "v" + package.json version
#   - CHANGELOG.md must contain a "## [X.Y.Z]" section (used as release notes)
#   - build + unit + smoke tests must pass
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: write # create the GitHub Release and upload assets

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # needed to verify the tag is on main

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Verify tag is on main and matches package.json
        id: meta
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$version" != "$pkg" ]; then
            echo "::error::Tag $tag does not match package.json version $pkg"; exit 1
          fi
          git fetch -q origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $tag points at a commit that is not on main"; exit 1
          fi
          prerelease=false
          case "$version" in *-*) prerelease=true ;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section"; exit 1
          fi
          cat release-notes.md

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test (unit + smoke)
        run: npm test

      - name: Package (npm pack)
        run: npm pack

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: v${{ steps.meta.outputs.version }}
          body_path: release-notes.md
          prerelease: ${{ steps.meta.outputs.prerelease }}
          files: mcp-telegram-server-${{ steps.meta.outputs.version }}.tgz
          fail_on_unmatched_files: true
