# CI: build and run the test suite on every commit (all branches) and every
# pull request.
#
# npm test runs the unit suite (tests/*.test.ts, fake Telegram client — no
# network, no credentials) and the smoke test (spawns the MCP server with fake
# credentials and checks tools/list).
# The live check against real Telegram (scripts/live-check.ts) intentionally
# stays out of CI: it requires real credentials in ~/.secrets.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build & test (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24", "26"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (tsc, strict)
        run: npm run build

      - name: Unit tests (fake client, no network)
        run: npm run test:unit

      - name: Smoke test (server start + tools/list)
        run: npm run test:smoke
