# CI: build and run the test suite on every commit (all branches) and every
# pull request, publishing an industry-standard results dashboard:
#   - JUnit XML from node:test  -> dorny/test-reporter check run + failure
#     annotations, and the run Summary
#   - Cobertura/LCOV coverage   -> irongut/CodeCoverageSummary (+ PR comment)
#   - markdown dashboard        -> $GITHUB_STEP_SUMMARY via scripts/ci-summary.ts
#   - raw reports (JUnit/Cobertura/LCOV) uploaded as artifacts
#
# The unit suite uses a fake Telegram client — no network, no credentials.
# The live check (scripts/live-check.ts) stays out of CI: it requires real
# credentials in ~/.secrets.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read
  actions: read
  checks: write # dorny/test-reporter publishes a check run with annotations

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build & test (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24", "26"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (tsc, strict)
        run: npm run build

      - name: Unit tests with coverage (JUnit + Cobertura/LCOV)
        run: npm run test:ci

      - name: Publish run summary (tests + coverage)
        if: ${{ !cancelled() }}
        run: npm run ci:summary

      - name: Test report (check run + failure annotations)
        uses: dorny/test-reporter@v3
        if: ${{ !cancelled() }}
        with:
          name: Unit tests (node ${{ matrix.node-version }})
          path: reports/junit.xml
          reporter: java-junit
          fail-on-error: false

      - name: Coverage summary (thresholds 60/80)
        uses: irongut/CodeCoverageSummary@v1.3.0
        if: ${{ !cancelled() }}
        with:
          filename: coverage/cobertura-coverage.xml
          badge: true
          fail_below_min: false
          format: markdown
          hide_branch_rate: false
          hide_complexity: true
          indicators: true
          output: both
          thresholds: '60 80'

      - name: Add coverage comment to PR
        uses: marocchino/sticky-pull-request-comment@v2
        if: ${{ github.event_name == 'pull_request' }}
        with:
          recreate: true
          path: code-coverage-results.md

      - name: Upload raw reports (JUnit, Cobertura, LCOV)
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: test-reports-node-${{ matrix.node-version }}
          path: |
            reports/junit.xml
            coverage/cobertura-coverage.xml
            coverage/lcov.info
            coverage/coverage-summary.json
            reports/badges/*.json
          if-no-files-found: warn
          retention-days: 30

  # Publishes shields.io endpoint JSON (tests / coverage) to the orphan
  # `badges` branch so the README badges reflect the latest main build.
  # Only runs for pushes to main; PRs and feature branches never touch it.
  publish-badges:
    name: publish README badges
    needs: test
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # push to the badges branch
    steps:
      - name: Download reports (node 24)
        uses: actions/download-artifact@v8
        with:
          name: test-reports-node-24
          path: artifact

      - name: Push badge JSON to the badges branch
        env:
          REPO: ${{ github.repository }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          src="$(find artifact -type d -name badges | head -1)"
          test -n "$src" || { echo "no badge JSON in artifact"; exit 1; }
          mkdir publish && cd publish
          git init -q -b badges
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp "../$src"/*.json .
          git add -A
          git commit -q -m "Update badges for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${REPO}.git" badges
