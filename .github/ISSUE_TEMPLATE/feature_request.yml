name: Feature request
description: Propose a new tool, parameter or behavior
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what blocks you today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Tool name, parameters, example request/response
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
